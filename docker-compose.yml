services:
  mc:
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    depends_on:
      restore-backup:
        condition: service_completed_successfully
    ports:
      - "${MC_SERVER_PORT}:${MC_SERVER_PORT}"
      - "8100:8100" # Bluemap
    environment:
      EULA: "TRUE"
      VERSION: "1.21.10"
      TYPE: "FABRIC"
      INIT_MEMORY: 2G
      MAX_MEMORY: 6G
      SERVER_PORT: "${MC_SERVER_PORT}"
      DIFFICULTY: "hard"
      ENABLE_COMMAND_BLOCK: true
      ONLINE_MODE: true
      MOTD: "Remember the Niklaus Wirth's trick"
      ICON: https://github.com/L3odr0id/minecraft-server-config/blob/main/server-icon.png?raw=true
      ENABLE_WHITELIST: true
      WHITELIST_FILE: https://raw.githubusercontent.com/L3odr0id/minecraft-server-config/refs/heads/main/whitelist.json
      OPS_FILE: https://raw.githubusercontent.com/L3odr0id/minecraft-server-config/refs/heads/main/ops.json
      REMOVE_OLD_MODS: true
      CF_API_KEY: ${CF_API_KEY}
      CURSEFORGE_FILES: |
        https://www.curseforge.com/minecraft/mc-mods/tschipcrafts-dynamic-lights-mod/files/7085776
        https://www.curseforge.com/minecraft/mc-mods/carpet/files/7113642
        https://www.curseforge.com/minecraft/mc-mods/carpet-tis-addition/files/7103891
        https://www.curseforge.com/minecraft/mc-mods/otterlib/files/7078044
		https://www.curseforge.com/minecraft/mc-mods/novaultlimit/files/6903217
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      MODRINTH_PROJECTS: |
        fabric-api:qNm2IWMn
        toggle-item-frames:w7OaOzm0
        bluemap:d38XhzPO
		bluemap-offline-player-markers-(fabric):bcZwEfeR
		bluemap-banners:owJiZjX6
        blossomtpa:u3w7YkDw
        lithium:oGKQMdyZ
        servux:1aOMm00f
        sit!:cJvlmbfO
        armorstandeditor:2SDNXDXK
        datapack:blazeandcaves-advancements-pack
        datapack:players-drop-heads
        datapack:afk-display
        datapack:sleep
        datapack:mob-heads
      REMOVE_OLD_DATAPACKS: true
    volumes:
      - "${MC_DATA_PATH}:/data"

  terminal_dogma:
    image: alpine:latest
    volumes:
      - "./:/workspace"
      - "/var/run/docker.sock:/var/run/docker.sock"
    entrypoint:
      - "/bin/sh"
      - -cex
      - |
          cd /workspace
          mkdir -p ${MC_DATA_PATH} ${MC_BACKUPS_PATH}
          if [ -z "$(ls -A ${MC_BACKUPS_PATH})" ]; then
            echo '$MC_BACKUPS_PATH is empty. Pulling latest backup from $HUB_REPO_NAME...'
            apk update
            apk add --no-cache docker
            docker pull $DOCKER_IMAGE_TO_PULL
            docker create --name temp_container $DOCKER_IMAGE_TO_PULL sh
            docker cp temp_container:/data.tgz "${MC_BACKUPS_PATH}/data.tgz"
            docker rm temp_container
            echo "Backup pulled and saved"
          else
            echo 'MC_BACKUPS_PATH is not empty. Skipping pull.'
          fi

  restore-backup:
    image: itzg/mc-backup
    restart: "no"
    entrypoint: restore-tar-backup
    depends_on:
      terminal_dogma:
        condition: service_completed_successfully
    volumes:
      - "${MC_DATA_PATH}:/data"
      - "${MC_BACKUPS_PATH}:/backups:ro"

  backups:
    image: itzg/mc-backup
    depends_on:
      mc:
        condition: service_healthy
    environment:
      BACKUP_INTERVAL: "24h"
      RCON_HOST: mc
      INITIAL_DELAY: 0
      BACKUP_ON_STARTUP: false
      PAUSE_IF_NO_PLAYERS: true
      LINK_LATEST: true
      EXCLUDES: bluemap/*,cache,*.tmp,*.jar
      SERVER_PORT: "${MC_SERVER_PORT}"
      DOCKER_IMAGE: "${HUB_REPO_NAME}:latest"
      POST_BACKUP_SCRIPT: |
        echo "DEBUG. The backup is finished"
    volumes:
      - "${MC_DATA_PATH}:/data:ro"
      - "${MC_BACKUPS_PATH}:/backups"

  watchdog:
    image: alpine:latest
    depends_on:
      terminal_dogma:
        condition: service_completed_successfully
    volumes:
      - "${MC_BACKUPS_PATH}:/backups"
      - "/var/run/docker.sock:/var/run/docker.sock"
    entrypoint:
      - "/bin/sh"
      - -c
      - |
          apk update
          apk add --no-cache inotify-tools docker
          cd /backups
          touch latest.tgz
          LAST_MOD_TIME="$(stat -c='%Y' latest.tgz)"

          while true; do
            sleep 360
            CURRENT_MOD_TIME="$(stat -c='%Y' latest.tgz)"

            if [ "$$LAST_MOD_TIME" != "$$CURRENT_MOD_TIME" ]; then
              LAST_MOD_TIME="$$CURRENT_MOD_TIME"
              echo "Modification detected: executing commands..."
              cat <<EOF > Dockerfile
              FROM scratch
              COPY latest.tgz /data.tgz
          EOF

              TIMESTAMP=$(date +%Y%m%d%H%M%S)
              TIMESTAMP_IMAGE="${HUB_REPO_NAME}:$$TIMESTAMP"
              LATEST_IMAGE="${HUB_REPO_NAME}:latest"
              docker build -t $$TIMESTAMP_IMAGE -t $$LATEST_IMAGE .
              docker login --username "$HUB_LOGIN" --password "$HUB_PASSWORD"
              docker push $$TIMESTAMP_IMAGE
              docker push $$LATEST_IMAGE
              echo "Backup images pushed to $HUB_REPO_NAME"
              docker rmi $$TIMESTAMP_IMAGE $$LATEST_IMAGE
              echo "Local backup images were removed"

            else
              echo "Nothing happened. $$LAST_MOD_TIME | $$CURRENT_MOD_TIME "
            fi
          done
